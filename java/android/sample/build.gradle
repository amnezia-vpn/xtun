plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'org.amnezia.xtunsample'
    compileSdk 35

    defaultConfig {
        applicationId "org.amnezia.xtunsample"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation files(findProperty('xtunAar') ?: "$rootDir/../../../build/xtun.aar")
}
